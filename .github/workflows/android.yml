name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: meal-mapper-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Phones cannot download Actions artifacts without a GitHub login.
      # A release asset is a plain .apk link that opens in any mobile browser.
      - name: Publish APK to the latest-debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk meal-mapper-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug meal-mapper-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Meal Mapper (latest debug build)" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7} on ${{ github.ref_name }}."

name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: meal-mapper-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error


  # Opens the app on an emulator and taps every enabled entry point. Catches crashes before the user does.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: meal-mapper-${{ github.run_number }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator (release and debug)
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            find apk -name '*.apk'
            bash tools/smoke.sh "$(find apk -name app-release.apk)" || (echo RELEASE_FAILED; bash tools/smoke.sh "$(find apk -name app-debug.apk)"; exit 1)

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ github.run_number }}
          path: smoke-out

  publish:
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: meal-mapper-${{ github.run_number }}
          path: apk

      # Phones cannot download Actions artifacts without a GitHub login.
      # A release asset is a plain .apk link that opens in any mobile browser.
      - name: Publish APK to the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(find apk -name app-release.apk)" meal-mapper.apk
          ls -lh meal-mapper.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug meal-mapper.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Meal Mapper (latest build)" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7} on ${{ github.ref_name }}."
